server:
  port: 8081

spring:
  application:
    name: ms-books-catalogue

  datasource:
    url: jdbc:h2:mem:catalogue_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka
