server:
  port: 8080

spring:
  application:
    name: cloud-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_ORIGIN:http://localhost:5173}
              - http://127.0.0.1:5173
              - http://localhost:4173
              - http://127.0.0.1:4173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      routes:
        - id: catalogue-route
          uri: lb://ms-books-catalogue
          predicates:
            - Path=/api/catalogue/**
          filters:
            - StripPrefix=2

        - id: payments-route
          uri: lb://ms-books-payments
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/payments(?<segment>/?.*), /payments${segment}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
